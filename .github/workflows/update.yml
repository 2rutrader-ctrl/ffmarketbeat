name: Update news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python fetch_feeds.py news.json
      - name: Commit if changed
        run: |
          git config user.name "ff-market-beat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news"
          git pull --rebase --autostash || true
          git push
