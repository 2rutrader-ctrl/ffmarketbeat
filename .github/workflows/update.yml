name: Update news

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python fetch_feeds.py news.json
      - name: Commit if changed
        run: |
          git config user.name "ff-market-beat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "Update headlines"
            git pull --rebase --autostash || true
            git push
          fi
